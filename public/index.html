<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>diffview</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/js/boot.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="toggle-stack" title="Show or hide the stack (s)" aria-label="Show or hide the stack">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="3.5" r="1.5"/><circle cx="4" cy="12.5" r="1.5"/><path d="M4 5v6M8 3.5h5.5M8 8h5.5M8 12.5h5.5"/><circle cx="4" cy="8" r="1.5"/></svg>
    </button>
    <button class="icon-btn" id="toggle-files" title="Show or hide the branch's files (f)" aria-label="Show or hide the branch's files">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M5.5 8h5M5.5 11h5"/></svg>
    </button>
    <div class="crumbs"><span id="repo-name"></span><span class="sep">/</span><span class="here" id="branch-name"></span></div>
    <span class="chip" id="source-chip" hidden></span>
    <span class="version-wrap">
      <button class="version-chip" id="version" type="button" title="Versions of this branch's diff that comments were made on" hidden></button>
      <div class="versions-menu" id="versions-menu" hidden></div>
    </span>
    <span class="batch" id="batch" hidden>
      <span class="batch-count" id="batch-count"></span>
      <button class="btn" type="button" id="batch-discard">Discard</button>
      <button class="btn btn-primary" type="button" id="batch-send">Send</button>
    </span>
    <div class="actions">
      <button class="icon-btn comments-btn" id="comments-btn" type="button" title="All comments on this branch" aria-label="All comments" hidden>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h9A1.5 1.5 0 0 1 14 4v5.5a1.5 1.5 0 0 1-1.5 1.5H8.5l-3 2.5V11h-2A1.5 1.5 0 0 1 2 9.5V4a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
        <span class="count" id="comments-count"></span>
      </button>
      <div class="seg" role="group" aria-label="Diff layout">
        <button type="button" data-layout="auto">Auto</button>
        <button type="button" data-layout="split" title="Side by side">Split</button>
        <button type="button" data-layout="unified" title="One column">Unified</button>
      </div>
      <span class="live" id="live" title="Live reload: connecting"></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme">
        <svg class="icon i-auto" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>
        <svg class="icon i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
        <svg class="icon i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <section class="panel" id="stack-panel">
        <h2>Stack <span class="faint" id="stack-meta"></span></h2>
        <ol class="stack" id="stack"></ol>
      </section>
      <section class="panel" id="files-panel">
        <h2>Files <span class="faint" id="files-meta"></span></h2>
        <div class="filter-wrap"><input id="filter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
        <div class="kind-filters" id="kind-filters" hidden></div>
        <nav class="tree" id="tree"></nav>
      </section>
    </aside>
    <main class="main" id="main">
      <div class="branch-head" id="branch-head"></div>
      <div class="review">
        <div class="review-main">
          <section class="description" id="description" hidden></section>
          <div class="branch-actions"><button class="link" type="button" id="comment-branch" hidden>Comment on the whole branch</button></div>
          <div class="branch-threads" id="branch-threads"></div>
          <div class="diffs" id="diffs"></div>
        </div>
        <aside class="rail" id="rail" aria-label="Comments"></aside>
      </div>
    </main>
  </div>
  <button class="comment-btn" id="comment-btn" type="button" hidden>
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h9A1.5 1.5 0 0 1 14 4v5.5a1.5 1.5 0 0 1-1.5 1.5H8.5l-3 2.5V11h-2A1.5 1.5 0 0 1 2 9.5V4a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
    Comment
  </button>
  <div class="composer" id="composer" hidden>
    <p class="composer-where" id="composer-where"></p>
    <textarea id="composer-text" rows="2" placeholder="Leave a comment for the agent…" aria-label="Comment"></textarea>
    <p class="key-hint" id="composer-hint"></p>
    <div class="thread-actions">
      <button class="btn" type="button" id="composer-cancel">Cancel</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="composer-alt"></button>
      <button class="btn btn-primary" type="button" id="composer-submit"></button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
